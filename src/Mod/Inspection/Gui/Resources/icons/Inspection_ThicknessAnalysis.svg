<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Created for FreeCAD Wall Thickness Analysis -->

<svg
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   id="svg2"
   version="1.1">
  <title>Wall Thickness Analysis</title>
  <metadata>
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:format>image/svg+xml</dc:format>
        <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
        <dc:title>Wall Thickness Analysis</dc:title>
        <dc:description>Wall thickness analysis tool for 3D printing inspection</dc:description>
        <cc:license rdf:resource="https://www.gnu.org/copyleft/lesser.html" />
      </cc:Work>
    </rdf:RDF>
  </metadata>
  
  <!-- Background circle with gradient effect -->
  <defs>
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#729fcf;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3465a4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#204a87;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcaf3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f57900;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="thicknessGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef2929;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8ae234;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#729fcf;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer wall (representing the model shell) -->
  <path
     d="M 8,8 L 56,8 L 56,56 L 8,56 Z"
     style="fill:url(#wallGradient);stroke:#204a87;stroke-width:2;stroke-linejoin:round;fill-opacity:1" />
  
  <!-- Inner cutout (representing hollow part) -->
  <path
     d="M 16,16 L 48,16 L 48,48 L 16,48 Z"
     style="fill:#ffffff;stroke:none" />
  
  <!-- Inner wall -->
  <path
     d="M 18,18 L 46,18 L 46,46 L 18,46 Z"
     style="fill:url(#innerGradient);stroke:#ce5c00;stroke-width:1.5;stroke-linejoin:round;fill-opacity:0.8" />
  
  <!-- Thickness measurement arrows -->
  <g transform="translate(0, 5)">
    <!-- Top wall thickness indicator -->
    <line x1="32" y1="8" x2="32" y2="16" 
          style="stroke:#ef2929;stroke-width:2;stroke-dasharray:2,1" />
    <polygon points="30,12 32,8 34,12" 
             style="fill:#ef2929;stroke:none" />
    <polygon points="30,12 32,16 34,12" 
             style="fill:#ef2929;stroke:none" />
  </g>
  
  <!-- Side wall thickness indicator -->
  <g transform="translate(-5, 0)">
    <line x1="8" y1="32" x2="16" y2="32" 
          style="stroke:#8ae234;stroke-width:2;stroke-dasharray:2,1" />
    <polygon points="12,30 8,32 12,34" 
             style="fill:#8ae234;stroke:none" />
    <polygon points="12,30 16,32 12,34" 
             style="fill:#8ae234;stroke:none" />
  </g>
  
  <!-- Measurement text representation -->
  <text x="32" y="62" 
        style="font-size:8px;font-family:sans-serif;text-anchor:middle;fill:#555753">
    mm
  </text>
  
  <!-- Heat map indicator (small colored squares) -->
  <rect x="52" y="4" width="8" height="4" style="fill:#ef2929" />
  <rect x="52" y="9" width="8" height="4" style="fill:#fcaf3e" />
  <rect x="52" y="14" width="8" height="4" style="fill:#8ae234" />
  <rect x="52" y="19" width="8" height="4" style="fill:#729fcf" />
  
</svg>
