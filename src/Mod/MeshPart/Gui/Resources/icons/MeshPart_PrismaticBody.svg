<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Prismatic Body icon: stacked cross-sections with loft -->
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Bottom cross-section (ellipse) -->
  <ellipse cx="32" cy="50" rx="20" ry="6" fill="none" stroke="#e67e22" stroke-width="2"/>
  <ellipse cx="32" cy="50" rx="20" ry="6" fill="#e67e22" fill-opacity="0.2"/>
  <!-- Middle cross-section -->
  <ellipse cx="32" cy="34" rx="16" ry="5" fill="none" stroke="#e67e22" stroke-width="2"/>
  <ellipse cx="32" cy="34" rx="16" ry="5" fill="#e67e22" fill-opacity="0.3"/>
  <!-- Top cross-section -->
  <ellipse cx="32" cy="18" rx="12" ry="4" fill="none" stroke="#e67e22" stroke-width="2"/>
  <ellipse cx="32" cy="18" rx="12" ry="4" fill="#e67e22" fill-opacity="0.4"/>
  <!-- Loft lines connecting sections -->
  <line x1="12" y1="50" x2="16" y2="34" stroke="#d35400" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="52" y1="50" x2="48" y2="34" stroke="#d35400" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="16" y1="34" x2="20" y2="18" stroke="#d35400" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="48" y1="34" x2="44" y2="18" stroke="#d35400" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Side edges -->
  <path d="M12,50 Q14,42 16,34 Q18,26 20,18" fill="none" stroke="#e67e22" stroke-width="2"/>
  <path d="M52,50 Q50,42 48,34 Q46,26 44,18" fill="none" stroke="#e67e22" stroke-width="2"/>
</svg>
