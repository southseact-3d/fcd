<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Mesh to Body icon: mesh triangle with arrow pointing to solid cube -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5f8a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Mesh triangle (left side) -->
  <polygon points="8,48 24,16 40,48" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="8,48 24,32 40,48" fill="#4a90d9" fill-opacity="0.3"/>
  <!-- Arrow -->
  <line x1="42" y1="32" x2="52" y2="32" stroke="#666" stroke-width="2"/>
  <polygon points="50,28 56,32 50,36" fill="#666"/>
  <!-- Solid cube (right side) -->
  <rect x="44" y="20" width="14" height="14" rx="1" fill="url(#grad1)" stroke="#2c5f8a" stroke-width="1.5"/>
  <polygon points="44,20 50,14 64,14 58,20" fill="#5ba3e6" stroke="#2c5f8a" stroke-width="1"/>
  <polygon points="58,20 64,14 64,28 58,34" fill="#3d7cb8" stroke="#2c5f8a" stroke-width="1"/>
</svg>
