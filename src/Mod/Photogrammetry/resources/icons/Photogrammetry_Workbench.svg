<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#1565C0" stroke-width="2"/>
  <!-- Camera body -->
  <rect x="18" y="24" width="28" height="20" rx="3" fill="#fff" opacity="0.9"/>
  <!-- Lens -->
  <circle cx="32" cy="34" r="7" fill="none" stroke="#1565C0" stroke-width="2"/>
  <circle cx="32" cy="34" r="4" fill="#1565C0"/>
  <!-- Viewfinder -->
  <rect x="28" y="20" width="8" height="5" rx="1" fill="#fff" opacity="0.9"/>
  <!-- 3D points (photogrammetry dots) -->
  <circle cx="14" cy="16" r="2" fill="#4CAF50"/>
  <circle cx="50" cy="14" r="2" fill="#4CAF50"/>
  <circle cx="12" cy="48" r="2" fill="#4CAF50"/>
  <circle cx="52" cy="50" r="2" fill="#4CAF50"/>
  <circle cx="8" cy="32" r="1.5" fill="#81C784"/>
  <circle cx="56" cy="30" r="1.5" fill="#81C784"/>
  <!-- Connection lines between points -->
  <line x1="14" y1="16" x2="50" y2="14" stroke="#4CAF50" stroke-width="0.8" opacity="0.5"/>
  <line x1="14" y1="16" x2="12" y2="48" stroke="#4CAF50" stroke-width="0.8" opacity="0.5"/>
  <line x1="50" y1="14" x2="52" y2="50" stroke="#4CAF50" stroke-width="0.8" opacity="0.5"/>
  <line x1="12" y1="48" x2="52" y2="50" stroke="#4CAF50" stroke-width="0.8" opacity="0.5"/>
</svg>
