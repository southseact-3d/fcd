<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5B8A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Build plate -->
  <rect x="8" y="48" width="48" height="4" rx="1" fill="#666"/>
  <rect x="6" y="52" width="52" height="3" rx="1" fill="#888"/>
  <!-- 3D printed object (layered cube) -->
  <g transform="translate(32,32)">
    <!-- Bottom layers -->
    <rect x="-16" y="8" width="32" height="3" rx="0.5" fill="#5BA3E6" opacity="0.9"/>
    <rect x="-14" y="5" width="28" height="3" rx="0.5" fill="#5BA3E6" opacity="0.85"/>
    <rect x="-12" y="2" width="24" height="3" rx="0.5" fill="#5BA3E6" opacity="0.8"/>
    <!-- Top layers with infill pattern -->
    <rect x="-10" y="-1" width="20" height="3" rx="0.5" fill="#5BA3E6" opacity="0.75"/>
    <rect x="-8" y="-4" width="16" height="3" rx="0.5" fill="#5BA3E6" opacity="0.7"/>
    <!-- Infill lines -->
    <line x1="-6" y1="-11" x2="6" y2="-11" stroke="#4A90D9" stroke-width="1.5"/>
    <line x1="-4" y1="-14" x2="4" y2="-14" stroke="#4A90D9" stroke-width="1.5"/>
    <line x1="-2" y1="-17" x2="2" y2="-17" stroke="#4A90D9" stroke-width="1.5"/>
    <!-- Nozzle indicator -->
    <circle cx="0" cy="-17" r="2" fill="#FFD700"/>
  </g>
  <!-- Title text -->
  <text x="32" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#4A90D9">SLICER</text>
</svg>
