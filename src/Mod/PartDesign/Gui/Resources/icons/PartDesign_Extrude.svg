<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="64px"
   height="64px"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#fce94f;stop-opacity:1" />
      <stop offset="1" style="stop-color:#edd400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:#c4a000;stop-opacity:1" />
      <stop offset="1" style="stop-color:#edd400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:#af7d00;stop-opacity:1" />
      <stop offset="1" style="stop-color:#ffed00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#ff5f00;stop-opacity:1" />
      <stop offset="1" style="stop-color:#c51900;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Base sketch (bottom face) -->
  <path
     d="M 12,44 L 32,52 L 52,44 L 32,36 Z"
     fill="url(#leftFace)"
     stroke="#302b00"
     stroke-width="1.5"
     stroke-linejoin="round" />
  <!-- Left face -->
  <path
     d="M 12,44 L 12,20 L 32,28 L 32,52 Z"
     fill="url(#leftFace)"
     stroke="#302b00"
     stroke-width="1.5"
     stroke-linejoin="round" />
  <!-- Right face -->
  <path
     d="M 32,52 L 32,28 L 52,20 L 52,44 Z"
     fill="url(#rightFace)"
     stroke="#302b00"
     stroke-width="1.5"
     stroke-linejoin="round" />
  <!-- Top face -->
  <path
     d="M 12,20 L 32,12 L 52,20 L 32,28 Z"
     fill="url(#topFace)"
     stroke="#302b00"
     stroke-width="1.5"
     stroke-linejoin="round" />
  <!-- Up arrow (additive) -->
  <path
     d="M 26,8 L 32,2 L 38,8"
     fill="none"
     stroke="url(#arrowGrad)"
     stroke-width="2.5"
     stroke-linecap="round"
     stroke-linejoin="round" />
  <line
     x1="32" y1="2" x2="32" y2="12"
     stroke="url(#arrowGrad)"
     stroke-width="2.5"
     stroke-linecap="round" />
  <!-- Down arrow (subtractive) -->
  <path
     d="M 26,56 L 32,62 L 38,56"
     fill="none"
     stroke="url(#arrowGrad)"
     stroke-width="2.5"
     stroke-linecap="round"
     stroke-linejoin="round" />
  <line
     x1="32" y1="62" x2="32" y2="52"
     stroke="url(#arrowGrad)"
     stroke-width="2.5"
     stroke-linecap="round" />
</svg>
