<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   width="64px"
   height="64px"
   version="1.1">
  <title>PartDesign_Additive_Coil</title>
  <g id="layer1" transform="translate(0,0)">
    <!-- Coil body - spring shape -->
    <path
       d="M 20,52 C 12,48 12,44 20,40 C 28,36 28,32 20,28 C 12,24 12,20 20,16 C 28,12 28,8 20,4"
       style="fill:none;stroke:#0090ff;stroke-width:4;stroke-linecap:round"/>
    <!-- Coil wire thickness - right side -->
    <path
       d="M 24,52 C 32,48 32,44 24,40 C 16,36 16,32 24,28 C 32,24 32,20 24,16 C 16,12 16,8 24,4"
       style="fill:none;stroke:#0046ff;stroke-width:3;stroke-linecap:round"/>
    <!-- Cross-section circle at top -->
    <circle cx="22" cy="6" r="4" style="fill:#0090ff;fill-opacity:0.8;stroke:#0046ff;stroke-width:1.5"/>
    <!-- Cross-section circle at bottom -->
    <circle cx="22" cy="50" r="4" style="fill:#0090ff;fill-opacity:0.8;stroke:#0046ff;stroke-width:1.5"/>
    <!-- Plus sign for additive -->
    <line x1="48" y1="24" x2="48" y2="40" style="stroke:#00aa00;stroke-width:3;stroke-linecap:round"/>
    <line x1="40" y1="32" x2="56" y2="32" style="stroke:#00aa00;stroke-width:3;stroke-linecap:round"/>
  </g>
</svg>
