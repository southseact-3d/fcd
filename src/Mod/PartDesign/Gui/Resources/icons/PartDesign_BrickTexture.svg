<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" fill="#8B4513" stroke="#5D3A1A" stroke-width="2" rx="2"/>
  
  <!-- Mortar lines (gray) -->
  <line x1="2" y1="18" x2="62" y2="18" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="2" y1="34" x2="62" y2="34" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="2" y1="50" x2="62" y2="50" stroke="#C0C0C0" stroke-width="2"/>
  
  <!-- Vertical mortar lines (staggered pattern) -->
  <line x1="20" y1="2" x2="20" y2="18" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="44" y1="2" x2="44" y2="18" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="10" y1="18" x2="10" y2="34" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="32" y1="18" x2="32" y2="34" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="54" y1="18" x2="54" y2="34" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="20" y1="34" x2="20" y2="50" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="44" y1="34" x2="44" y2="50" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="10" y1="50" x2="10" y2="62" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="32" y1="50" x2="32" y2="62" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="54" y1="50" x2="54" y2="62" stroke="#C0C0C0" stroke-width="2"/>
</svg>
