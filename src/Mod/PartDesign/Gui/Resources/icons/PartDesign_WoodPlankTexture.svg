<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" fill="#8B4513" stroke="#5D3A1A" stroke-width="2" rx="2"/>
  
  <!-- Horizontal plank lines (darker wood gaps) -->
  <line x1="2" y1="16" x2="62" y2="16" stroke="#5D3A1A" stroke-width="2"/>
  <line x1="2" y1="32" x2="62" y2="32" stroke="#5D3A1A" stroke-width="2"/>
  <line x1="2" y1="48" x2="62" y2="48" stroke="#5D3A1A" stroke-width="2"/>
  
  <!-- Vertical end joints (staggered pattern) -->
  <line x1="32" y1="2" x2="32" y2="16" stroke="#5D3A1A" stroke-width="2"/>
  <line x1="16" y1="16" x2="16" y2="32" stroke="#5D3A1A" stroke-width="2"/>
  <line x1="48" y1="16" x2="48" y2="32" stroke="#5D3A1A" stroke-width="2"/>
  <line x1="32" y1="32" x2="32" y2="48" stroke="#5D3A1A" stroke-width="2"/>
  <line x1="16" y1="48" x2="16" y2="62" stroke="#5D3A1A" stroke-width="2"/>
  <line x1="48" y1="48" x2="48" y2="62" stroke="#5D3A1A" stroke-width="2"/>
</svg>
