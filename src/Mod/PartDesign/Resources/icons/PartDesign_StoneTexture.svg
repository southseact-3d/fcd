<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" fill="#808080" stroke="#606060" stroke-width="2" rx="2"/>
  
  <!-- Stone pattern (irregular polygons) -->
  <!-- Row 1 -->
  <polygon points="2,2 18,2 16,16 2,18" fill="#909090" stroke="#606060" stroke-width="1"/>
  <polygon points="18,2 38,2 40,16 16,16" fill="#888888" stroke="#606060" stroke-width="1"/>
  <polygon points="38,2 54,2 56,14 40,16" fill="#909090" stroke="#606060" stroke-width="1"/>
  <polygon points="54,2 62,2 62,18 56,14" fill="#888888" stroke="#606060" stroke-width="1"/>
  
  <!-- Row 2 -->
  <polygon points="2,18 14,16 12,32 2,34" fill="#888888" stroke="#606060" stroke-width="1"/>
  <polygon points="14,16 34,18 32,32 12,32" fill="#909090" stroke="#606060" stroke-width="1"/>
  <polygon points="34,18 52,16 54,32 32,32" fill="#888888" stroke="#606060" stroke-width="1"/>
  <polygon points="52,16 62,18 62,34 54,32" fill="#909090" stroke="#606060" stroke-width="1"/>
  
  <!-- Row 3 -->
  <polygon points="2,34 16,32 14,48 2,50" fill="#909090" stroke="#606060" stroke-width="1"/>
  <polygon points="16,32 36,34 38,48 14,48" fill="#888888" stroke="#606060" stroke-width="1"/>
  <polygon points="36,34 56,32 54,48 38,48" fill="#909090" stroke="#606060" stroke-width="1"/>
  <polygon points="56,32 62,34 62,50 54,48" fill="#888888" stroke="#606060" stroke-width="1"/>
  
  <!-- Row 4 -->
  <polygon points="2,50 18,48 20,62 2,62" fill="#888888" stroke="#606060" stroke-width="1"/>
  <polygon points="18,48 40,50 38,62 20,62" fill="#909090" stroke="#606060" stroke-width="1"/>
  <polygon points="40,50 58,48 62,62 38,62" fill="#888888" stroke="#606060" stroke-width="1"/>
  <polygon points="58,48 62,50 62,62 62,62" fill="#909090" stroke="#606060" stroke-width="1"/>
</svg>
