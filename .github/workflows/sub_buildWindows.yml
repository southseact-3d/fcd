# This is a build and test workflow for CI of FreeCAD.
# This workflow aims at building and testing FreeCAD on Windows using MSVC + Ninja.
#
# KEY CHANGES from MSBuild version:
#   - Generator switched from MSVC/MSBuild to "Ninja Multi-Config"
#   - Ninja produces a minimal rebuild set natively — only changed TUs recompile
#   - MSBuild incremental build tree cache removed (Ninja .ninja_deps/.ninja_log
#     persist in the build cache instead, giving Ninja its own incremental state)
#   - ccache config fixed: DIRECT=false (MSVC), NOINODECACHE=false, MAXSIZE=5G
#   - ccache cache key uses run_id so latest cache is always saved, restore-keys
#     provides best-available fallback regardless of source changes
#   - Explicit "changed files first" pre-build step compiles only touched .cpp
#     files before the full Ninja build, surfacing errors faster

name: Build Windows
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.txt'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      artifactBasename:
        description: "Base name for artifact"
        required: false
        type: string
        default: "FreeCAD"
      allowedToFail:
        description: "whether a failed build is allowed"
        required: false
        type: boolean
        default: false
      forceRebuild:
        description: "Force full rebuild ignoring cache"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      artifactBasename:
        required: true
        type: string
      allowedToFail:
        required: false
        default: false
        type: boolean
      forceRebuild:
        required: false
        default: false
        type: boolean
    outputs:
      reportFile:
        value: ${{ jobs.Build.outputs.reportFile }}

jobs:
  Build:
    runs-on: windows-2022
    continue-on-error: ${{ inputs.allowedToFail || false }}
    env:
      # -------------------------------------------------------------------
      # ccache settings
      # DIRECT=false  — required for MSVC; the /showIncludes dependency
      #                 scanning that DIRECT mode relies on doesn't work
      #                 correctly with cl.exe, causing spurious cache misses.
      # NOINODECACHE=false — allow inode cache for faster lookups
      # MAXSIZE=5G    — FreeCAD's object files easily exceed 2 G
      # SLOPPINESS    — pch_defines removed since PCH is OFF
      # -------------------------------------------------------------------
      CCACHE_COMPILERCHECK: "content"
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 1
      CCACHE_DIR: C:/FC/cache/
      CCACHE_LOGFILE: C:/logs/ccache.log
      CCACHE_MAXSIZE: 5G
      CCACHE_NODIRECT: true        # disables direct mode (MSVC-incompatible); replaces CCACHE_DIRECT=false
      CCACHE_NOHASHDIR: true
      # CCACHE_NOINODECACHE intentionally omitted — absence = inode cache enabled
      CCACHE_SLOPPINESS: "include_file_ctime,include_file_mtime,time_macros"
      ## Build dir must be on the SAME drive as the source checkout to avoid
      ## CMake AUTOMOC generating broken cross-drive relative include paths.
      ## GitHub workspace is on D: on windows-latest runners.
      ## Only ccache dir stays on C: (large, not involved in AUTOMOC).
      builddir: D:/FC/build/release/
      cacheKey: Windows
      ccachebindir: C:/FC/ccache
      config: release
      libpackdir: D:/FC/libpack/
      logdir: C:/logs/
      reportdir: C:/report/
      reportfilename: ${{ inputs.artifactBasename || 'FreeCAD' }}-report.md
    outputs:
      reportFile: ${{ steps.Init.outputs.reportFile }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Enable Win32 long paths
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
          git config --system core.longpaths true
          Write-Host "✓ Long paths enabled"

      - name: Checking out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          submodules: 'recursive'

      - name: Verify submodule initialization
        run: |
          Write-Host "Checking submodule status..."
          git submodule status
          Write-Host "Verifying critical submodules..."
          if (-not (Test-Path "src/Mod/AddonManager/CMakeLists.txt")) {
            Write-Error "AddonManager submodule not properly initialized"
            exit 1
          }
          Write-Host "Submodules verified successfully"

      - name: Make needed directories, files and initializations
        id: Init
        run: |
          # Create all needed directories
          # D: is the GitHub workspace drive on windows-latest runners
          # C: is used only for ccache (large cache, separate from build)
          New-Item -ItemType Directory -Force -Path ${{ env.CCACHE_DIR }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.ccachebindir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.libpackdir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.builddir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.logdir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.reportdir }} | Out-Null
          echo "reportFile=${{ env.reportfilename }}" >> $GITHUB_OUTPUT

      - name: Get Ccache
        uses: ./.github/workflows/actions/windows/getCcache
        with:
          ccachebindir: ${{ env.ccachebindir }}

      - name: Get Libpack
        uses: ./.github/workflows/actions/windows/getLibpack
        with:
          libpackdir: ${{ env.libpackdir }}

      # ------------------------------------------------------------------
      # Set up the MSVC environment early so VCToolsVersion is available
      # for the cache key hash.  This must run before "Generate file hash"
      # so the compiler identity is included in ccache/Ninja cache keys.
      # ------------------------------------------------------------------
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # ------------------------------------------------------------------
      # ccache cache key strategy:
      #   key    = per-branch + config hash so cache is reusable across runs
      #   restore-keys = cascading fallback — always restores the newest
      #                  available cache regardless of what source changed.
      #   The combined_hash (CMakeLists + CMakePresets) is kept in the
      #   restore-key prefix so a config change still matches recent caches
      #   but gets a new save slot, avoiding stale config pollution.
      # ------------------------------------------------------------------
      - name: Generate file hash for cache key
        id: file-hash
        run: |
          $cmakeHash = Get-FileHash -Path CMakeLists.txt -Algorithm SHA256 | Select-Object -ExpandProperty Hash
          $presetsHash = Get-FileHash -Path CMakePresets.json -Algorithm SHA256 | Select-Object -ExpandProperty Hash

          # Include the MSVC toolchain version so cache keys change when the
          # runner image upgrades (e.g. VS2022 → VS2026).  VCToolsVersion is
          # set by ilammy/msvc-dev-cmd which runs earlier in this workflow.
          $vcTools = $env:VCToolsVersion
          if (-not $vcTools) { $vcTools = "unknown" }
          Write-Host "VCToolsVersion: $vcTools"

          $combinedHash = "$cmakeHash-$presetsHash-$vcTools"
          echo "cmake_hash=$cmakeHash" >> $env:GITHUB_OUTPUT
          echo "combined_hash=$combinedHash" >> $env:GITHUB_OUTPUT
          Write-Host "Combined hash: $combinedHash"
        shell: pwsh

      - name: Restore compiler cache
        id: cache-restore
        if: inputs.forceRebuild != true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}
          restore-keys: |
            FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-
            FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-
            FC-CCACHE-${{ env.cacheKey }}-${{ github.ref }}
            FC-CCACHE-${{ env.cacheKey }}

      # ------------------------------------------------------------------
      # Ninja build cache: persists .ninja_deps, .ninja_log, and all .obj
      # files so Ninja can perform a true incremental build on next run.
      # Key strategy mirrors ccache — run_id in save key, cascading restore.
      # ------------------------------------------------------------------
      - name: Restore Ninja build cache
        id: ninja-cache-restore
        if: inputs.forceRebuild != true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.builddir }}
          key: FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}
          restore-keys: |
            FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-
            FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-
            FC-NINJA-${{ env.cacheKey }}-${{ github.ref }}
            FC-NINJA-${{ env.cacheKey }}

      - name: Print cache status
        if: always()
        run: |
          Write-Host "=== Cache Status ==="
          $ccacheKey = "FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}"
          $ninjaKey  = "FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}"
          Write-Host "ccache key   : $ccacheKey"
          Write-Host "ninja key    : $ninjaKey"
          $ccacheHit = "${{ steps.cache-restore.outputs.cache-hit }}"
          $ninjaHit  = "${{ steps.ninja-cache-restore.outputs.cache-hit }}"
          Write-Host "ccache hit   : $(if ($ccacheHit -eq 'true') { '✓ HIT' } else { '✗ MISS' })"
          Write-Host "Ninja cache  : $(if ($ninjaHit  -eq 'true') { '✓ HIT — next build will be incremental' } else { '✗ MISS — full build this run' })"
          Write-Host "===================="

      - name: Print Ccache statistics before build, reset stats and print config
        run: |
          . $env:ccachebindir\ccache -s
          . $env:ccachebindir\ccache -z
          . $env:ccachebindir\ccache -p

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@3a6cbe35ba64df7ca70c51365c4aff65db9a9037 # v2.1.1
        with:
          cmake-version: '3.31.6'

      # ------------------------------------------------------------------
      # Verify Ninja is available.
      # windows-latest runners ship with Ninja pre-installed; no need to
      # install via Chocolatey (which fails if a newer version exists).
      # ------------------------------------------------------------------
      - name: Verify Ninja
        run: |
          $ninjaPath = (Get-Command ninja -ErrorAction SilentlyContinue).Source
          if (-not $ninjaPath) {
            Write-Error "Ninja not found on PATH"
            exit 1
          }
          Write-Host "Ninja found at: $ninjaPath"
          ninja --version

      # ------------------------------------------------------------------
      # CMake configuration — key changes vs MSBuild version:
      #   -G "Ninja"   replaces the default MSVC generator
      #   -DCMAKE_BUILD_TYPE=Release  single-config Ninja, set at configure time
      #   CMAKE_JOB_POOLS removed   (Ninja manages parallelism itself)
      #   CLToolPath removed        (was MSBuild-specific, caused conflicts)
      #   CMAKE_C/CXX_COMPILER_LAUNCHER still used — correct way to wrap
      #   cl.exe with ccache under any generator
      # ------------------------------------------------------------------
      - name: Clear stale CMake cache if generator or compiler changed
        run: |
          $cacheFile = "${{ env.builddir }}\CMakeCache.txt"
          if (Test-Path $cacheFile) {
            $cached = Select-String -Path $cacheFile -Pattern "CMAKE_GENERATOR:INTERNAL=" | Select-Object -First 1
            $generatorOk = $cached -and $cached.Line -match "^CMAKE_GENERATOR:INTERNAL=Ninja$"

            # Check if the cached compiler still exists on disk
            $cachedCompiler = Select-String -Path $cacheFile -Pattern "CMAKE_C_COMPILER:FILEPATH=" | Select-Object -First 1
            $compilerOk = $false
            if ($cachedCompiler -and $cachedCompiler.Line -match "CMAKE_C_COMPILER:FILEPATH=(.+)") {
              $compilerPath = $Matches[1].Trim()
              $compilerOk = Test-Path $compilerPath
              if (-not $compilerOk) {
                Write-Host "Cached compiler not found: $compilerPath"
              }
            }

            if (-not $generatorOk -or -not $compilerOk) {
              $reason = if (-not $generatorOk) { "generator changed" } else { "compiler not found" }
              Write-Host "CMake cache stale ($reason) — clearing..."
              Remove-Item $cacheFile -Force
              $cmakeFiles = "${{ env.builddir }}\CMakeFiles"
              if (Test-Path $cmakeFiles) { Remove-Item $cmakeFiles -Recurse -Force }
              Write-Host "Cache cleared — full reconfigure will run."
            } else {
              Write-Host "CMake cache valid — skipping clear."
            }
          } else {
            Write-Host "No CMakeCache.txt found — fresh configure."
          }

      - name: Configuring CMake
        run: >
          cmake -B"${{ env.builddir }}" .
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DFREECAD_USE_PCH=OFF
          -DFREECAD_RELEASE_PDB=OFF
          -DFREECAD_LIBPACK_DIR="${{ env.libpackdir }}"
          -DCMAKE_C_COMPILER_LAUNCHER="${{ env.ccachebindir }}/ccache.exe"
          -DCMAKE_CXX_COMPILER_LAUNCHER="${{ env.ccachebindir }}/ccache.exe"
          -DFREECAD_COPY_DEPEND_DIRS_TO_BUILD=ON
          -DFREECAD_COPY_LIBPACK_BIN_TO_BUILD=ON
          -DFREECAD_COPY_PLUGINS_BIN_TO_BUILD=ON
          -DCMAKE_AUTOGEN_PARALLEL=4

      - name: Check CMake configuration
        run: |
          if (-not (Test-Path "${{ env.builddir }}\build.ninja")) {
            Write-Error "CMake configuration failed - build.ninja not found"
            exit 1
          }
          Write-Host "✓ build.ninja found — Ninja generator active"

      # ------------------------------------------------------------------
      # NINJA INCREMENTAL BUILD
      # Ninja handles dependency tracking natively - no need to detect
      # changed files via git. This approach works correctly for:
      #   - Re-running failed builds (partial build state is restored from cache)
      #   - Multiple PRs/commits since last successful build
      #   - New, modified, and deleted files are detected automatically
      # ------------------------------------------------------------------
      - name: Build with Ninja
        id: build
        run: |
          # Honour forceRebuild flag - when true, run full build without dry-run check
          if ("${{ inputs.forceRebuild }}" -eq "true") {
            Write-Host "forceRebuild=true — full rebuild requested"
            cmake --build "${{ env.builddir }}" --config Release -j32
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Build failed with exit code $LASTEXITCODE"
              exit 1
            }
            Write-Host "✓ Build complete"
            exit 0
          }

          # Check if there's anything to build (dry-run)
          # This avoids the ~20 minute scan when nothing has changed
          $ninjaCmd = "ninja -C `"${{ env.builddir }}`" -n"
          Write-Host "Checking if build is needed (dry-run)..."
          $dryRunOutput = Invoke-Expression $ninjaCmd 2>&1 | Out-String

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Ninja dry-run failed with exit code $LASTEXITCODE"
            exit 1
          }

          # Check if ninja says "no work to do"
          if ($dryRunOutput -match "no work to do") {
            Write-Host "✓ Build is up to date — nothing to build"
            exit 0
          }

          # Show what would be built and proceed with build
          Write-Host "Build needed — starting build..."
          Write-Host "===================================="
          cmake --build "${{ env.builddir }}" --config Release -j32

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed with exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "✓ Build complete"

      - name: Print Ccache statistics after build
        if: always()
        run: |
          Write-Host "=== CCache Statistics After Build ==="
          . $env:ccachebindir\ccache -s
          Write-Host "====================================="

      - name: C++ unit tests
        if: false # Disabled because seems to not function on Windows build
        timeout-minutes: 1
        run: |
          . ${{ env.builddir }}\tests\Release\Tests_run --gtest_output=json:${{ env.reportdir }}gtest_results.json

      - name: FreeCAD CLI tests
        run: |
          . ${{ env.builddir }}\bin\FreeCADCmd -t 0

      - name: Save Compiler Cache
        id: cache-save
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-${{ github.run_id }}

      # ------------------------------------------------------------------
      # Save the Ninja build tree (replaces the old MSBuild build tree cache).
      # Persisting .ninja_deps, .ninja_log, and all .obj/.lib files gives
      # Ninja full knowledge of what was built last time so it can do a
      # minimal incremental rebuild on the next run.
      # ------------------------------------------------------------------
      - name: Save Ninja build cache
        id: ninja-cache-save
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.builddir }}
          key: FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-${{ github.run_id }}

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            Write-Error "NSIS installation failed"
            exit 1
          }
          Write-Host "✓ NSIS installed"

      - name: Patch NSIS scripts to remove nsProcess and LogSet dependencies
        run: |
          $installerDir = "${{ github.workspace }}\package\WindowsInstaller"

          # --- FreeCAD-installer.nsi: remove !include nsProcess.nsh ---
          $nsiPath = Join-Path $installerDir "FreeCAD-installer.nsi"
          $nsi = Get-Content $nsiPath
          $nsi = $nsi | Where-Object { $_ -notmatch '!include nsProcess\.nsh' }
          Set-Content $nsiPath $nsi -Encoding UTF8
          Write-Host "✓ Removed nsProcess include from FreeCAD-installer.nsi"

          # --- include/init.nsh: remove FindProcess + Unload blocks ---
          $initPath = Join-Path $installerDir "include\init.nsh"
          $lines = Get-Content $initPath
          $cleaned = [System.Collections.Generic.List[string]]::new()
          $skip = $false
          foreach ($line in $lines) {
            if ($line -match '# Check that FreeCAD is not currently running') {
              $skip = $true; continue
            }
            if ($skip) {
              if ($line -match 'nsProcess::' -or $line -match '# if running' -or $line -match '# plugin must be unloaded') {
                continue
              }
              if ($line -match '\$\{endif\}') {
                $skip = $false; continue
              }
            }
            $cleaned.Add($line)
          }
          Set-Content $initPath ($cleaned -join "`n") -Encoding UTF8
          Write-Host "✓ Removed nsProcess calls from include\init.nsh"

          # --- setup/install.nsh: remove LogSet on (requires special NSIS build) ---
          $installPath = Join-Path $installerDir "setup\install.nsh"
          $install = Get-Content $installPath
          $install = $install | Where-Object { $_ -notmatch 'LogSet\s+on' }
          Set-Content $installPath $install -Encoding UTF8
          Write-Host "✓ Removed LogSet from setup\install.nsh"

          # Verify clean
          $remaining = Select-String -Path $nsiPath,$initPath,$installPath -Pattern 'nsProcess|LogSet' -SimpleMatch
          if ($remaining) {
            $remaining | ForEach-Object { Write-Warning "Remaining: $($_.Filename):$($_.LineNumber): $($_.Line.Trim())" }
          } else {
            Write-Host "✓ All patches applied cleanly"
          }

      - name: Create Windows Installer
        if: always()
        run: |
          $buildDir    = "${{ env.builddir }}"
          $installerDir = Join-Path $buildDir.TrimEnd('/\') "installer"
          $stagingDir  = Join-Path $installerDir "FreeCAD"
          $nsisDir     = "${{ github.workspace }}\package\WindowsInstaller"

          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          foreach ($d in @("bin","Mod","data","doc","Ext","lib")) {
            $src = Join-Path $buildDir $d
            if (Test-Path $src) {
              Write-Host "Staging: $d"
              Copy-Item $src -Destination (Join-Path $stagingDir $d) -Recurse -Force
            } else {
              Write-Warning "Skipping (not found): $d"
            }
          }

          $appVersion = "1.2.0"
          $cmd = Join-Path $buildDir "bin\FreeCADCmd.exe"
          if (Test-Path $cmd) {
            $out = & $cmd --version 2>&1
            if ($out -match "(\d+\.\d+\.\d+)") { $appVersion = $Matches[1] }
          }
          Write-Host "Version: $appVersion"

          $exeName   = "FreeCAD_${appVersion}-Windows-x86_64-installer.exe"
          $nsisExe   = "C:\Program Files (x86)\NSIS\makensis.exe"
          $nsiScript = Join-Path $nsisDir "FreeCAD-installer.nsi"

          # /DFC_TEST_BUILD disables SetCompressor /SOLID lzma — without this
          # NSIS exhausts memory on the multi-GB FreeCAD build output.
          & $nsisExe `
            "/DFILES_FREECAD=$stagingDir" `
            "/DFILES_THUMBS=$nsisDir\thumbnail" `
            "/DExeFile=$exeName" `
            "/DFC_TEST_BUILD" `
            $nsiScript

          if ($LASTEXITCODE -ne 0) {
            Write-Error "NSIS failed with exit code $LASTEXITCODE"
            exit 1
          }

          $generated = Get-ChildItem $nsisDir -Filter "*.exe" |
                       Sort-Object LastWriteTime -Descending |
                       Select-Object -First 1
          if ($generated) {
            $dest = Join-Path $installerDir $exeName
            Move-Item $generated.FullName $dest -Force
            Write-Host "✓ Installer: $dest"
            Write-Host "  Size: $([math]::Round((Get-Item $dest).Length / 1MB, 1)) MB"
          } else {
            Write-Error "NSIS reported success but no .exe found in $nsisDir"
            exit 1
          }

      - name: Upload Windows Installer
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ inputs.artifactBasename || 'FreeCAD' }}-Windows-Installer
          path: ${{ env.builddir }}\installer\*.exe

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ inputs.artifactBasename || 'FreeCAD' }}-Logs
          path: |
            ${{ env.logdir }}
