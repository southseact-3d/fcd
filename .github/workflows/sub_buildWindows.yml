# This is a build and test workflow for CI of FreeCAD.
# This workflow aims at building and testing FreeCAD on Windows using MSVC + Ninja.
#
# KEY CHANGES from MSBuild version:
#   - Generator switched from MSVC/MSBuild to "Ninja Multi-Config"
#   - Ninja produces a minimal rebuild set natively — only changed TUs recompile
#   - MSBuild incremental build tree cache removed (Ninja .ninja_deps/.ninja_log
#     persist in the build cache instead, giving Ninja its own incremental state)
#   - ccache config fixed: DIRECT=false (MSVC), NOINODECACHE=false, MAXSIZE=5G
#   - ccache cache key uses run_id so latest cache is always saved, restore-keys
#     provides best-available fallback regardless of source changes
#   - Explicit "changed files first" pre-build step compiles only touched .cpp
#     files before the full Ninja build, surfacing errors faster

name: Build Windows
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.txt'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      artifactBasename:
        description: "Base name for artifact"
        required: false
        type: string
        default: "FreeCAD"
      allowedToFail:
        description: "whether a failed build is allowed"
        required: false
        type: boolean
        default: false
      forceRebuild:
        description: "Force full rebuild ignoring cache"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      artifactBasename:
        required: true
        type: string
      allowedToFail:
        required: false
        default: false
        type: boolean
      forceRebuild:
        required: false
        default: false
        type: boolean
    outputs:
      reportFile:
        value: ${{ jobs.Build.outputs.reportFile }}

jobs:
  Build:
    runs-on: windows-latest
    continue-on-error: ${{ inputs.allowedToFail || false }}
    env:
      # -------------------------------------------------------------------
      # ccache settings
      # DIRECT=false  — required for MSVC; the /showIncludes dependency
      #                 scanning that DIRECT mode relies on doesn't work
      #                 correctly with cl.exe, causing spurious cache misses.
      # NOINODECACHE=false — allow inode cache for faster lookups
      # MAXSIZE=5G    — FreeCAD's object files easily exceed 2 G
      # SLOPPINESS    — pch_defines removed since PCH is OFF
      # -------------------------------------------------------------------
      CCACHE_COMPILERCHECK: "content"
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 1
      CCACHE_DIR: C:/FC/cache/
      CCACHE_LOGFILE: C:/logs/ccache.log
      CCACHE_MAXSIZE: 5G
      CCACHE_NODIRECT: true        # disables direct mode (MSVC-incompatible); replaces CCACHE_DIRECT=false
      CCACHE_NOHASHDIR: true
      # CCACHE_NOINODECACHE intentionally omitted — absence = inode cache enabled
      CCACHE_SLOPPINESS: "include_file_ctime,include_file_mtime,time_macros"
      ## Build dir must be on the SAME drive as the source checkout to avoid
      ## CMake AUTOMOC generating broken cross-drive relative include paths.
      ## GitHub workspace is on D: on windows-latest runners.
      ## Only ccache dir stays on C: (large, not involved in AUTOMOC).
      builddir: D:/FC/build/release/
      cacheKey: Windows
      ccachebindir: C:/FC/ccache/
      config: release
      libpackdir: D:/FC/libpack/
      logdir: C:/logs/
      reportdir: C:/report/
      reportfilename: ${{ inputs.artifactBasename || 'FreeCAD' }}-report.md
    outputs:
      reportFile: ${{ steps.Init.outputs.reportFile }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Enable Win32 long paths
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
          git config --system core.longpaths true
          Write-Host "✓ Long paths enabled"

      - name: Checking out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          submodules: 'recursive'

      - name: Verify submodule initialization
        run: |
          Write-Host "Checking submodule status..."
          git submodule status
          Write-Host "Verifying critical submodules..."
          if (-not (Test-Path "src/Mod/AddonManager/CMakeLists.txt")) {
            Write-Error "AddonManager submodule not properly initialized"
            exit 1
          }
          Write-Host "Submodules verified successfully"

      - name: Make needed directories, files and initializations
        id: Init
        run: |
          # Create all needed directories
          # D: is the GitHub workspace drive on windows-latest runners
          # C: is used only for ccache (large cache, separate from build)
          New-Item -ItemType Directory -Force -Path ${{ env.CCACHE_DIR }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.ccachebindir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.libpackdir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.builddir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.logdir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.reportdir }} | Out-Null
          echo "reportFile=${{ env.reportfilename }}" >> $GITHUB_OUTPUT

      - name: Get Ccache
        uses: ./.github/workflows/actions/windows/getCcache
        with:
          ccachebindir: ${{ env.ccachebindir }}

      - name: Get Libpack
        uses: ./.github/workflows/actions/windows/getLibpack
        with:
          libpackdir: ${{ env.libpackdir }}

      # ------------------------------------------------------------------
      # ccache cache key strategy:
      #   key    = includes run_id so every run saves a fresh cache entry
      #   restore-keys = cascading fallback — always restores the newest
      #                  available cache regardless of what source changed.
      #   The combined_hash (CMakeLists + CMakePresets) is kept in the
      #   restore-key prefix so a config change still matches recent caches
      #   but gets a new save slot, avoiding stale config pollution.
      # ------------------------------------------------------------------
      - name: Generate file hash for cache key
        id: file-hash
        run: |
          $cmakeHash = Get-FileHash -Path CMakeLists.txt -Algorithm SHA256 | Select-Object -ExpandProperty Hash
          $presetsHash = Get-FileHash -Path CMakePresets.json -Algorithm SHA256 | Select-Object -ExpandProperty Hash
          $combinedHash = "$cmakeHash-$presetsHash"
          echo "cmake_hash=$cmakeHash" >> $env:GITHUB_OUTPUT
          echo "combined_hash=$combinedHash" >> $env:GITHUB_OUTPUT
          Write-Host "Combined hash: $combinedHash"
        shell: pwsh

      - name: Restore compiler cache
        id: cache-restore
        if: inputs.forceRebuild != true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-
            FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-
            FC-CCACHE-${{ env.cacheKey }}-

      # ------------------------------------------------------------------
      # Ninja build cache: persists .ninja_deps, .ninja_log, and all .obj
      # files so Ninja can perform a true incremental build on next run.
      # Key strategy mirrors ccache — run_id in save key, cascading restore.
      # ------------------------------------------------------------------
      - name: Restore Ninja build cache
        id: ninja-cache-restore
        if: inputs.forceRebuild != true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.builddir }}
          key: FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-
            FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-
            FC-NINJA-${{ env.cacheKey }}-

      - name: Print cache status
        if: always()
        run: |
          Write-Host "=== Cache Status ==="
          $ccacheHit = "${{ steps.cache-restore.outputs.cache-hit }}"
          $ninjaHit  = "${{ steps.ninja-cache-restore.outputs.cache-hit }}"
          Write-Host "ccache hit  : $(if ($ccacheHit -eq 'true') { '✓ HIT' } else { '✗ MISS' })"
          Write-Host "Ninja cache : $(if ($ninjaHit  -eq 'true') { '✓ HIT — next build will be incremental' } else { '✗ MISS — full build this run' })"
          Write-Host "===================="

      - name: Print Ccache statistics before build, reset stats and print config
        run: |
          . $env:ccachebindir\ccache -s
          . $env:ccachebindir\ccache -z
          . $env:ccachebindir\ccache -p

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@3a6cbe35ba64df7ca70c51365c4aff65db9a9037 # v2.1.1
        with:
          cmake-version: '3.31.6'

      # ------------------------------------------------------------------
      # Install Ninja.
      # windows-latest ships with Ninja but pinning a known version is safer.
      # ------------------------------------------------------------------
      - name: Install Ninja
        run: |
          choco install ninja -y --version=1.12.1
          ninja --version

      # ------------------------------------------------------------------
      # Set up the MSVC environment so cl.exe / link.exe are on PATH.
      # Ninja requires the compiler to be on PATH; unlike MSBuild it does
      # not auto-discover Visual Studio.
      # ------------------------------------------------------------------
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # ------------------------------------------------------------------
      # CMake configuration — key changes vs MSBuild version:
      #   -G "Ninja"   replaces the default MSVC generator
      #   -DCMAKE_BUILD_TYPE=Release  single-config Ninja, set at configure time
      #   CMAKE_JOB_POOLS removed   (Ninja manages parallelism itself)
      #   CLToolPath removed        (was MSBuild-specific, caused conflicts)
      #   CMAKE_C/CXX_COMPILER_LAUNCHER still used — correct way to wrap
      #   cl.exe with ccache under any generator
      # ------------------------------------------------------------------
      - name: Clear stale CMake cache if generator changed
        run: |
          $cacheFile = "${{ env.builddir }}\CMakeCache.txt"
          if (Test-Path $cacheFile) {
            $cached = Select-String -Path $cacheFile -Pattern "CMAKE_GENERATOR:INTERNAL=" | Select-Object -First 1
            $generatorOk = $cached -and $cached.Line -match "^CMAKE_GENERATOR:INTERNAL=Ninja$"
            if (-not $generatorOk) {
              Write-Host "CMake cache stale (generator or flags changed) — clearing..."
              Remove-Item $cacheFile -Force
              $cmakeFiles = "${{ env.builddir }}\CMakeFiles"
              if (Test-Path $cmakeFiles) { Remove-Item $cmakeFiles -Recurse -Force }
              Write-Host "Cache cleared — full reconfigure will run."
            } else {
              Write-Host "CMake cache valid — skipping clear."
            }
          } else {
            Write-Host "No CMakeCache.txt found — fresh configure."
          }

      - name: Configuring CMake
        run: >
          cmake -B"${{ env.builddir }}" .
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DFREECAD_USE_PCH=OFF
          -DFREECAD_RELEASE_PDB=OFF
          -DFREECAD_LIBPACK_DIR="${{ env.libpackdir }}"
          -DCMAKE_C_COMPILER_LAUNCHER="${{ env.ccachebindir }}/ccache.exe"
          -DCMAKE_CXX_COMPILER_LAUNCHER="${{ env.ccachebindir }}/ccache.exe"
          -DFREECAD_COPY_DEPEND_DIRS_TO_BUILD=ON
          -DFREECAD_COPY_LIBPACK_BIN_TO_BUILD=ON
          -DFREECAD_COPY_PLUGINS_BIN_TO_BUILD=ON
          -DCMAKE_AUTOGEN_PARALLEL=4

      - name: Check CMake configuration
        run: |
          if (-not (Test-Path "${{ env.builddir }}\build.ninja")) {
            Write-Error "CMake configuration failed - build.ninja not found"
            exit 1
          }
          Write-Host "✓ build.ninja found — Ninja generator active"

      # ------------------------------------------------------------------
      # CHANGED FILES FIRST — pre-build step
      #
      # Ninja's dependency graph means it will only recompile what is
      # necessary. This extra step goes one further: it explicitly compiles
      # only the .cpp files that changed since the last commit BEFORE the
      # full build. Benefits:
      #   1. Errors in your changed files surface in seconds, not after
      #      waiting for unrelated modules to finish linking.
      #   2. ccache gets those object files warm so the full build is faster.
      #
      # Ninja target for a source file is its .obj path relative to builddir.
      # We derive it from the source path using the same convention CMake uses:
      #   src/Mod/Foo/Bar.cpp  ->  src/Mod/Foo/CMakeFiles/Foo.dir/Bar.cpp.obj
      #
      # If a file's target can't be determined we skip it — the full build
      # below will catch it. Failures here are non-fatal (continue-on-error).
      # ------------------------------------------------------------------
      - name: Build changed source files first
        id: changed-first
        continue-on-error: true
        run: |
          # Get list of changed .cpp/.cxx/.cc files vs previous commit
          $changedSources = git diff --name-only HEAD~1 HEAD |
            Where-Object { $_ -match '\.(cpp|cxx|cc)$' }

          if (-not $changedSources) {
            Write-Host "No changed C++ source files detected — skipping pre-build step"
            exit 0
          }

          Write-Host "=== Changed source files ==="
          $changedSources | ForEach-Object { Write-Host "  $_" }
          Write-Host "============================"

          $builtCount = 0
          $skippedCount = 0

          foreach ($src in $changedSources) {
            # Normalise path separator
            $srcNorm = $src -replace '/', '\'

            # Derive the CMake object file path.
            # CMake Ninja layout:  <dir>/CMakeFiles/<target>.dir/<file>.obj
            # We search build.ninja for the rule that mentions this source.
            $srcForward = $src -replace '\\', '/'
            $ninjaLine = Select-String -Path "${{ env.builddir }}\build.ninja" `
                           -Pattern "/$($srcForward -replace '\.', '\.')$" `
                           -SimpleMatch | Select-Object -First 1

            if ($ninjaLine) {
              # Extract the output (.obj) path from the ninja rule line
              # Ninja format:  "build path/to/file.obj: CXX_COMPILER ..."
              $objMatch = $ninjaLine.Line -match '^build\s+(.+\.obj)\s*:'
              if ($objMatch) {
                $objTarget = $Matches[1].Trim()
                Write-Host "Pre-building: $objTarget"
                cmake --build "${{ env.builddir }}" --config Release --target $objTarget
                if ($LASTEXITCODE -eq 0) { $builtCount++ }
                else {
                  Write-Warning "Pre-build failed for $objTarget — will retry in full build"
                }
              } else {
                Write-Host "Could not parse obj target for $src — skipping"
                $skippedCount++
              }
            } else {
              Write-Host "Source not found in build.ninja: $src — may be a new file, skipping"
              $skippedCount++
            }
          }

          Write-Host ""
          Write-Host "Pre-build summary: $builtCount compiled, $skippedCount skipped"

      # ------------------------------------------------------------------
      # Full Ninja build.
      # -j 4  matches the previous MSBuild MultiProcToolCount.
      #        Increase if the runner has more cores (windows-latest = 4).
      # ------------------------------------------------------------------
      - name: Compiling sources (Ninja full build)
        run: |
          cmake --build "${{ env.builddir }}" --config Release -j4
          Write-Host "✓ Ninja build complete"

      - name: Print Ccache statistics after build
        if: always()
        run: |
          Write-Host "=== CCache Statistics After Build ==="
          . $env:ccachebindir\ccache -s
          Write-Host "====================================="

      - name: C++ unit tests
        if: false # Disabled because seems to not function on Windows build
        timeout-minutes: 1
        run: |
          . ${{ env.builddir }}\tests\Release\Tests_run --gtest_output=json:${{ env.reportdir }}gtest_results.json

      - name: FreeCAD CLI tests
        run: |
          . ${{ env.builddir }}\bin\FreeCADCmd -t 0

      - name: Save Compiler Cache
        id: cache-save
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-${{ github.run_id }}

      # ------------------------------------------------------------------
      # Save the Ninja build tree (replaces the old MSBuild build tree cache).
      # Persisting .ninja_deps, .ninja_log, and all .obj/.lib files gives
      # Ninja full knowledge of what was built last time so it can do a
      # minimal incremental rebuild on the next run.
      # ------------------------------------------------------------------
      - name: Save Ninja build cache
        id: ninja-cache-save
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.builddir }}
          key: FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-${{ github.run_id }}

      - name: Install NSIS
        run: |
          # Install NSIS via chocolatey
          choco install nsis -y --no-progress
          
          # Verify NSIS installed correctly
          $nsisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisExe)) {
            Write-Error "NSIS installation failed - makensis.exe not found"
            exit 1
          }
          Write-Host "✓ NSIS installed at $nsisExe"
          
          # Download nsProcess plugin with error handling and fallback
          $pluginDir  = "C:\Program Files (x86)\NSIS\Plugins\x86-unicode"
          $includeDir = "C:\Program Files (x86)\NSIS\Include"
          $zipUrl     = "https://nsis.sourceforge.io/mediawiki/images/1/18/NsProcess.zip"
          $zipPath    = "$env:TEMP\NsProcess.zip"
          $extractDir = "$env:TEMP\NsProcess"
          
          try {
            Write-Host "Downloading nsProcess plugin..."
            # Use TLS 1.2 explicitly — sourceforge requires it
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -TimeoutSec 60 -UseBasicParsing
            
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            
            # nsProcess zip has inconsistent internal structure across versions — search for files
            $dllFile = Get-ChildItem -Path $extractDir -Recurse -Filter "nsProcessW.dll" | Select-Object -First 1
            $nshFile = Get-ChildItem -Path $extractDir -Recurse -Filter "nsProcess.nsh"  | Select-Object -First 1
            
            if ($dllFile) {
              Copy-Item $dllFile.FullName -Destination "$pluginDir\nsProcess.dll" -Force
              Write-Host "✓ nsProcess.dll installed"
            } else {
              Write-Warning "nsProcessW.dll not found in archive — installer may lack process-check features"
            }
            
            if ($nshFile) {
              Copy-Item $nshFile.FullName -Destination "$includeDir\nsProcess.nsh" -Force
              Write-Host "✓ nsProcess.nsh installed"
            } else {
              Write-Warning "nsProcess.nsh not found in archive"
            }
          }
          catch {
            # nsProcess is optional — it adds process-running checks to the installer
            # If it fails to download, log the warning and continue rather than failing the build
            Write-Warning "nsProcess plugin download failed: $_"
            Write-Warning "Continuing without nsProcess — installer will be created without process-check support"
            Write-Warning "To fix: check network access to nsis.sourceforge.io or bundle the plugin in the repo"
          }

      - name: Create Windows Installer
        run: |
          $buildDir = "${{ env.builddir }}"
          $installDir = $buildDir.TrimEnd([char]92)
          $installerDir = Join-Path $installDir "installer"
          New-Item -ItemType Directory -Path $installerDir -Force

          $stagingDir = Join-Path $installerDir "FreeCAD"
          New-Item -ItemType Directory -Path $stagingDir -Force

          Copy-Item -Path "${{ env.builddir }}\bin" -Destination "$stagingDir\bin" -Recurse -Force
          Copy-Item -Path "${{ env.builddir }}\Mod" -Destination "$stagingDir\Mod" -Recurse -Force
          if (Test-Path "${{ env.builddir }}\data") { Copy-Item -Path "${{ env.builddir }}\data" -Destination "$stagingDir\data" -Recurse -Force }
          if (Test-Path "${{ env.builddir }}\doc")  { Copy-Item -Path "${{ env.builddir }}\doc"  -Destination "$stagingDir\doc"  -Recurse -Force }
          if (Test-Path "${{ env.builddir }}\Ext")  { Copy-Item -Path "${{ env.builddir }}\Ext"  -Destination "$stagingDir\Ext"  -Recurse -Force }
          if (Test-Path "${{ env.builddir }}\lib")  { Copy-Item -Path "${{ env.builddir }}\lib"  -Destination "$stagingDir\lib"  -Recurse -Force }

          $version = "${{ env.builddir }}\bin\FreeCADCmd.exe"
          $versionOutput = & $version --version 2>&1
          $versionMatch = $versionOutput -match "(\d+\.\d+\.\d+)"
          $appVersion = if ($versionMatch) { $Matches[1] } else { "1.2.0" }
          Write-Host "Detected version: $appVersion"

          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          $installerNsi = "${{ github.workspace }}\package\WindowsInstaller\FreeCAD-installer.nsi"
          $env:FILES_FREECAD = $stagingDir
          $env:FILES_THUMBS  = "${{ github.workspace }}\package\WindowsInstaller\thumbnail"

          # Run NSIS — errors here are non-fatal so the artifact upload still runs
          $nsisResult = & $nsisPath `
            /D"FILES_FREECAD=$stagingDir" `
            /D"FILES_THUMBS=${{ github.workspace }}\package\WindowsInstaller\thumbnail" `
            /D"ExeFile=FreeCAD_${appVersion}-Windows-x86_64-installer.exe" `
            $installerNsi
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "NSIS exited with code $LASTEXITCODE — installer may not have been created"
          }

          $generatedInstaller = Get-ChildItem -Path "${{ github.workspace }}\package\WindowsInstaller" -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($generatedInstaller) {
            Move-Item -Path $generatedInstaller.FullName -Destination "$installerDir\FreeCAD_${appVersion}-Windows-x86_64-installer.exe" -Force
            Write-Host "Installer created: $installerDir\FreeCAD_${appVersion}-Windows-x86_64-installer.exe"
          }

      - name: Upload Windows Installer
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ inputs.artifactBasename || 'FreeCAD' }}-Windows-Installer
          path: |
            ${{ env.builddir }}\installer\*.exe

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ inputs.artifactBasename || 'FreeCAD' }}-Logs
          path: |
            ${{ env.logdir }}
