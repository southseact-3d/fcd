# SPDX-License-Identifier: LGPL-2.1-or-later
# CLI test harness for the PartDesign workbench.
#
# Runs after sub_buildUbuntu.yml succeeds. Downloads the install tree
# artifact, sets FREECADCMD, and invokes tests/cli/runner.py.
# Uploads the results/ directory as a workflow artifact for review.

name: PartDesign CLI Tests

on:
  workflow_dispatch:
    inputs:
      allowedToFail:
        description: "Allow tests to fail without failing the workflow"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      allowedToFail:
        required: false
        type: boolean
        default: false

concurrency:
  group: FC-CLI-Tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  RunCLITests:
    runs-on: ubuntu-24.04
    continue-on-error: ${{ inputs.allowedToFail || false }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Checking out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install Python deps for the runner
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq python3-pip jq unzip
          python3 -m pip install --upgrade pip --break-system-packages

      - name: Install Qt6 + FreeCAD runtime deps on the runner
        run: |
          set -e
          # The AppImage was built against the KDE Neon Qt6/PySide6 packages,
          # but AppImages built this way don't bundle Qt6 (they expect the host
          # to provide it). Install the runtime Qt6 libs so FreeCADCmd can load.
          # Also add the KDE Neon repo so we get the exact same Qt6 version.
          sudo wget -qO- http://archive.neon.kde.org/public.key | sudo gpg --dearmor -o /usr/share/keyrings/neon-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/neon-keyring.gpg] http://archive.neon.kde.org/user noble main" | sudo tee /etc/apt/sources.list.d/neon-qt.list
          sudo apt-get update -y -qq

          # Install packages one batch at a time so a single missing package
          # doesn't block the rest. Use --ignore-missing to skip unavailable
          # packages (some Qt6 sub-packages have different names across distros).
          sudo apt-get install -y -qq --no-install-recommends \
            libqt6core6 \
            libqt6gui6 \
            libqt6widgets6 \
            libqt6network6 \
            libqt6opengl6 \
            libqt6openglwidgets6 \
            libqt6printsupport6 \
            libqt6svg6 \
            libqt6svgwidgets6 \
            libqt6uitools6 \
            libqt6xml6 \
            libqt6dbus6 \
            libqt6sql6 \
            libqt6sql6-sqlite \
            libqt6concurrent6 \
            libqt6statemachine6 \
            libshiboken6-py3-6.11 \
            libpyside6-py3-6.11 \
            python3-pyside6.qtcore \
            python3-pyside6.qtgui \
            python3-pyside6.qtwidgets \
            python3-pyside6.qtnetwork \
            python3-pyside6.qtsvg \
            python3-pyside6.qtsvgwidgets \
            2>&1 | tail -5

          # Install FreeCAD's other runtime deps (OCCT, Coin, Boost, etc.)
          sudo apt-get install -y -qq --no-install-recommends \
            libcoin80t64 \
            libocct-data-exchange-7_7 \
            libocct-ocaf-7_7 \
            libocct-visualization-7_7 \
            libocct-foundation-7_7 \
            libocct-modeling-algorithms-7_7 \
            libocct-modeling-data-7_7 \
            libxerces-c3.2t64 \
            libboost-all-dev \
            libeigen3-dev \
            libvtk9.3 \
            libpcl-common1.15t64 \
            libpcl-io1.15t64 \
            libmedc11 \
            libyaml-cpp0.8t64 \
            libzipios++0v5 \
            libspnav0 \
            libkdtree++-dev \
            libfmt-dev \
            nlohmann-json3-dev \
            netgen \
            netgen-headers \
            python3-pivy \
            python3-ply \
            python3-pybind11 \
            python3-cxx-dev \
            python3-av \
            python-is-python3 \
            python3-defusedxml \
            python3-git \
            python3-lark \
            python3-markdown \
            python3-matplotlib \
            python3-packaging \
            swig \
            2>&1 | tail -5 || true

          # Verify libQt6Core is actually installed
          echo "=== libQt6Core.so.6 location ==="
          find /usr/lib -name "libQt6Core.so.6" 2>/dev/null | head -3
          if ! find /usr/lib -name "libQt6Core.so.6" 2>/dev/null | grep -q .; then
            echo "::error::libQt6Core.so.6 not installed after apt-get"
            exit 1
          fi

          # The AppImage was built against older lib versions than what
          # Ubuntu 24.04 ships. Create symlinks so FreeCADCmd can find them.
          # This is fragile but works for libfmt (API-compatible across versions).
          echo "=== Creating lib version symlinks ==="
          # libfmt: Ubuntu 24.04 has .so.11, FreeCAD wants .so.9
          FMT_ACTUAL=$(find /usr/lib -name "libfmt.so.*" -not -name "*.dev" 2>/dev/null | head -1)
          if [ -n "$FMT_ACTUAL" ] && [ ! -f /usr/lib/x86_64-linux-gnu/libfmt.so.9 ]; then
            sudo ln -sf "$FMT_ACTUAL" /usr/lib/x86_64-linux-gnu/libfmt.so.9
            echo "Symlinked libfmt.so.9 -> $FMT_ACTUAL"
          fi
          # List what we have for debugging
          echo "libfmt versions available:"
          find /usr/lib -name "libfmt.so*" 2>/dev/null

      - name: Find and download AppImage from latest successful Ubuntu build
        id: find-appimage
        run: |
          set -e
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Looking for AppImage artifact from latest successful Ubuntu build on branch: $BRANCH"
          # Find the latest successful sub_buildUbuntu run on this branch
          RUNS=$(curl -s -H "Authorization: token ${{ github.token }}" \
                       -H "Accept: application/vnd.github+json" \
                       "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sub_buildUbuntu.yml/runs?branch=$BRANCH&status=success&per_page=1")
          RUN_ID=$(echo "$RUNS" | jq -r '.workflow_runs[0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful Ubuntu build run found on branch $BRANCH. Trigger sub_buildUbuntu.yml first."
            exit 1
          fi
          echo "Found successful Ubuntu build run: $RUN_ID"
          # Find the AppImage artifact in that run (name matches *AppImage*)
          ART_URL=$(curl -s -H "Authorization: token ${{ github.token }}" \
                         -H "Accept: application/vnd.github+json" \
                         "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
                  | jq -r '.artifacts[] | select(.name | test("AppImage")) | .archive_download_url' | head -1)
          if [ -z "$ART_URL" ]; then
            echo "::error::No AppImage artifact found in run $RUN_ID"
            exit 1
          fi
          echo "Downloading: $ART_URL"
          mkdir -p /tmp/appimage
          curl -sL -H "Authorization: token ${{ github.token }}" -o /tmp/appimage/appimage.zip "$ART_URL"
          cd /tmp/appimage && unzip -o appimage.zip
          ls -lh /tmp/appimage/

      - name: Make AppImage executable + extract FreeCADCmd
        id: extract
        run: |
          APPIMAGE_PATH=$(find /tmp/appimage -name "*.AppImage" -type f | head -1)
          if [ -z "$APPIMAGE_PATH" ]; then
            echo "::error::No AppImage found in /tmp/appimage"
            ls -la /tmp/appimage/
            exit 1
          fi
          echo "AppImage: $APPIMAGE_PATH"
          chmod +x "$APPIMAGE_PATH"

          # Extract the AppImage to a directory so we can call FreeCADCmd directly
          # (AppRun requires FUSE which isn't always available on runners)
          EXTRACT_DIR=/tmp/fcd-extract
          mkdir -p "$EXTRACT_DIR"
          cd "$EXTRACT_DIR"
          "$APPIMAGE_PATH" --appimage-extract >/dev/null 2>&1 || true
          ls "$EXTRACT_DIR/squashfs-root/usr/bin/" 2>&1 | head -10

          FREECADCMD="$EXTRACT_DIR/squashfs-root/usr/bin/freecadcmd"
          if [ ! -x "$FREECADCMD" ]; then
            FREECADCMD="$EXTRACT_DIR/squashfs-root/usr/bin/FreeCADCmd"
          fi
          if [ ! -x "$FREECADCMD" ]; then
            echo "::error::FreeCADCmd not found in extracted AppImage"
            find "$EXTRACT_DIR" -name "*freecadcmd*" -o -name "*FreeCADCmd*" 2>/dev/null
            exit 1
          fi
          echo "FreeCADCmd: $FREECADCMD"

          # Find all lib dirs in the extracted AppImage (FreeCAD bundles libs
          # in multiple subdirs: usr/lib, usr/lib/x86_64-linux-gnu, etc.)
          # Use a broad find that catches any directory containing .so files.
          LIB_DIRS=$(find "$EXTRACT_DIR/squashfs-root" -type f -name "*.so*" 2>/dev/null \
                    | xargs -n1 dirname 2>/dev/null | sort -u | tr '\n' ':' | sed 's/:$//')
          echo "Library dirs: $LIB_DIRS"

          # Write a wrapper script that sets LD_LIBRARY_PATH + PYTHONHOME only
          # for FreeCADCmd invocations (NOT globally, so the system python3
          # that runs runner.py keeps working).
          # Using printf to avoid heredoc indentation issues.
          WRAPPER=/tmp/fcd-extract/freecadcmd-wrapper.sh
          {
            printf '#!/bin/bash\n'
            printf '# Wrapper to invoke FreeCADCmd with correct LD_LIBRARY_PATH\n'
            printf '# and PYTHONHOME so it finds its bundled libs and Python.\n'
            printf 'export LD_LIBRARY_PATH="%s:$LD_LIBRARY_PATH"\n' "$LIB_DIRS"
            printf 'export PYTHONHOME="%s"\n' "$EXTRACT_DIR/squashfs-root/usr"
            printf 'export PYTHONPATH="%s/lib/python3.12:%s/lib/python3.12/lib-dynload"\n' "$EXTRACT_DIR/squashfs-root/usr" "$EXTRACT_DIR/squashfs-root/usr"
            printf 'exec "%s" "$@"\n' "$FREECADCMD"
          } > "$WRAPPER"
          chmod +x "$WRAPPER"
          echo "Wrapper contents:"
          cat "$WRAPPER"
          echo "FREECADCMD=$WRAPPER" >> $GITHUB_OUTPUT

          # Verify it actually runs (via the wrapper)
          echo "=== FreeCADCmd version check (via wrapper) ==="
          "$WRAPPER" --version 2>&1 | head -5 || true

      - name: Run CLI tests
        env:
          FREECADCMD: ${{ steps.extract.outputs.FREECADCMD }}
        run: |
          cd ${{ github.workspace }}
          python3 tests/cli/runner.py --timeout 90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: partdesign-cli-test-results
          path: |
            tests/cli/results/
          if-no-files-found: warn
          retention-days: 30
