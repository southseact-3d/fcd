# Dev Patch Build Workflow
#
# Builds ONLY the targets that changed since the last successful build.
# Uses git diff + source-to-target mapping to determine what needs rebuilding.
# Produces a slim patch artifact (typically 5-50 MB) instead of a full installer.
#
# Usage:
#   - Push to main → automatic patch build
#   - Manual trigger via workflow_dispatch
#
# The patch artifact can be downloaded and applied by the in-app updater
# (src/Mod/Update/) or manually via the apply_patch script.

name: Dev Patch Build
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.txt'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      forceFullBuild:
        description: "Force full build (ignore selective targeting)"
        required: false
        type: boolean
        default: false

# Cancel in-progress runs for the same branch
concurrency:
  group: dev-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  BuildPatch:
    runs-on: windows-2022
    env:
      # ccache settings
      CCACHE_COMPILERCHECK: "content"
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 1
      CCACHE_DIR: C:/FC/cache/
      CCACHE_LOGFILE: C:/logs/ccache.log
      CCACHE_MAXSIZE: 5G
      CCACHE_NODIRECT: true
      CCACHE_NOHASHDIR: true
      CCACHE_SLOPPINESS: "include_file_ctime,include_file_mtime,time_macros"
      # Build paths — same layout as sub_buildWindows.yml
      builddir: D:/FC/build/release/
      cacheKey: DevPatch
      ccachebindir: C:/FC/ccache
      config: release
      libpackdir: D:/FC/libpack/
      logdir: C:/logs/
      patchdir: C:/patch/

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Enable Win32 long paths
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
          git config --system core.longpaths true

      - name: Checkout with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Full history for diff against last SHA
          submodules: 'recursive'

      - name: Verify submodule initialization
        run: |
          git submodule status
          if (-not (Test-Path "src/Mod/AddonManager/CMakeLists.txt")) {
            Write-Error "AddonManager submodule not properly initialized"
            exit 1
          }

      - name: Initialize directories
        run: |
          New-Item -ItemType Directory -Force -Path ${{ env.CCACHE_DIR }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.ccachebindir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.libpackdir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.builddir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.logdir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.patchdir }} | Out-Null

      - name: Get Ccache
        uses: ./.github/workflows/actions/windows/getCcache
        with:
          ccachebindir: ${{ env.ccachebindir }}

      - name: Get Libpack
        uses: ./.github/workflows/actions/windows/getLibpack
        with:
          libpackdir: ${{ env.libpackdir }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # ------------------------------------------------------------------
      # Cache strategy: ccache (compiler cache) + Ninja build tree cache
      # Both are restored from the most recent available cache.
      # ------------------------------------------------------------------
      - name: Generate file hash for cache key
        id: file-hash
        run: |
          $cmakeHash = Get-FileHash -Path CMakeLists.txt -Algorithm SHA256 | Select-Object -ExpandProperty Hash
          $presetsHash = Get-FileHash -Path CMakePresets.json -Algorithm SHA256 | Select-Object -ExpandProperty Hash
          $vcTools = $env:VCToolsVersion
          if (-not $vcTools) { $vcTools = "unknown" }
          $combinedHash = "$cmakeHash-$presetsHash-$vcTools"
          echo "combined_hash=$combinedHash" >> $env:GITHUB_OUTPUT
          Write-Host "Combined hash: $combinedHash"

      - name: Restore compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}
          restore-keys: |
            FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-
            FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-
            FC-CCACHE-${{ env.cacheKey }}-${{ github.ref }}
            FC-CCACHE-${{ env.cacheKey }}

      - name: Restore Ninja build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.builddir }}
          key: FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}
          restore-keys: |
            FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-
            FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-
            FC-NINJA-${{ env.cacheKey }}-${{ github.ref }}
            FC-NINJA-${{ env.cacheKey }}

      - name: Print cache status
        run: |
          $ccacheHit = "${{ steps.cache-restore.outputs.cache-hit }}"
          $ninjaHit  = "${{ steps.ninja-cache-restore.outputs.cache-hit }}"
          Write-Host "ccache hit: $(if ($ccacheHit -eq 'true') { 'YES' } else { 'NO (full compile)' })"
          Write-Host "Ninja cache: $(if ($ninjaHit -eq 'true') { 'YES (incremental)' } else { 'NO (full build)' })"

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@3a6cbe35ba64df7ca70c51365c4aff65db9a9037 # v2.1.1
        with:
          cmake-version: '3.31.6'

      - name: Verify Ninja
        run: |
          $ninjaPath = (Get-Command ninja -ErrorAction SilentlyContinue).Source
          if (-not $ninjaPath) {
            Write-Error "Ninja not found on PATH"
            exit 1
          }
          Write-Host "Ninja found at: $ninjaPath"
          ninja --version

      # ------------------------------------------------------------------
      # CMake configure — skipped if build.ninja already exists and is valid
      # ------------------------------------------------------------------
      - name: Configure CMake (if needed)
        run: |
          $buildNinja = "${{ env.builddir }}\build.ninja"
          if (Test-Path $buildNinja) {
            Write-Host "build.ninja exists — skipping configure"
          } else {
            Write-Host "No build.ninja — running configure..."
            cmake -B"${{ env.builddir }}" . `
              -G "Ninja" `
              -DCMAKE_BUILD_TYPE=Release `
              -DFREECAD_USE_PCH=OFF `
              -DFREECAD_RELEASE_PDB=OFF `
              -DFREECAD_LIBPACK_DIR="${{ env.libpackdir }}" `
              -DCMAKE_C_COMPILER_LAUNCHER="${{ env.ccachebindir }}/ccache.exe" `
              -DCMAKE_CXX_COMPILER_LAUNCHER="${{ env.ccachebindir }}/ccache.exe" `
              -DFREECAD_COPY_DEPEND_DIRS_TO_BUILD=ON `
              -DFREECAD_COPY_LIBPACK_BIN_TO_BUILD=ON `
              -DFREECAD_COPY_PLUGINS_BIN_TO_BUILD=ON `
              -DCMAKE_AUTOGEN_PARALLEL=4
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CMake configure failed"
              exit 1
            }
          }

      # ------------------------------------------------------------------
      # Selective build: diff → map targets → build only those targets
      # ------------------------------------------------------------------
      - name: Determine changed targets and build
        id: selective-build
        run: |
          # Download the last SHA artifact if available
          $lastShaFile = "${{ env.patchdir }}\last_sha.txt"
          if (Test-Path $lastShaFile) {
            Write-Host "Using last SHA from previous run"
          } else {
            Write-Host "No previous SHA found — will do full build"
          }

          # Run the build_patch script
          python .github/workflows/scripts/build_patch.py `
            --build-dir "${{ env.builddir }}" `
            --last-sha-file $lastShaFile `
            --output-dir "${{ env.patchdir }}" `
            --sha-output $lastShaFile `
            --jobs 32 `
            --build-gui

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed"
            exit 1
          }
        shell: pwsh

      - name: Print Ccache statistics after build
        if: always()
        run: |
          . $env:ccachebindir\ccache -s

      # ------------------------------------------------------------------
      # Save caches — always run even if build failed
      # ------------------------------------------------------------------
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: FC-CCACHE-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-${{ github.run_id }}

      - name: Save Ninja build cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.builddir }}
          key: FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-${{ github.ref }}-${{ github.run_id }}

      # ------------------------------------------------------------------
      # Upload patch artifact
      # ------------------------------------------------------------------
      - name: Upload patch artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dev-patch-${{ github.run_number }}
          path: |
            ${{ env.patchdir }}/patch.zip
            ${{ env.patchdir }}/last_sha.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dev-patch-${{ github.run_number }}-Logs
          path: |
            ${{ env.logdir }}
