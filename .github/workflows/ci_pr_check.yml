# This workflow compiles changed files for Pull Requests.
# It runs on all PR events and serves as a pass/fail check for compilation.
# It does NOT create a Windows installer or modify the build cache.
# It compiles only changed .cpp files and generates needed ui_*.h headers.

name: PR Build Check

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
      - '.github/workflows/**'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  Build:
    runs-on: windows-latest
    env:
      builddir: D:/FC/build/release/
      libpackdir: D:/FC/libpack/
      logdir: C:/logs/

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Enable Win32 long paths
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
          git config --system core.longpaths true
          Write-Host "Long paths enabled"

      - name: Checking out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Fetch main branch for comparison
        run: |
          git fetch origin main:main

      - name: Check if source files changed
        id: check-files
        run: |
          $changedFiles = git diff --name-only main...HEAD -- '*.cpp' '*.h' '*.hpp' '*.c' '*.cc'
          if ($changedFiles) {
            Write-Host "Changed source files:"
            $changedFiles | ForEach-Object { Write-Host "  $_" }
            echo "has_changes=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No source files changed - skipping build"
            echo "has_changes=false" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Early exit if no source changes
        if: steps.check-files.outputs.has_changes == 'false'
        run: |
          Write-Host "No source files changed in this PR - exiting early"
          exit 0

      - name: Make needed directories
        run: |
          New-Item -ItemType Directory -Force -Path ${{ env.libpackdir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.builddir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.logdir }} | Out-Null

      - name: Get Libpack
        uses: ./.github/workflows/actions/windows/getLibpack
        with:
          libpackdir: ${{ env.libpackdir }}

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@3a6cbe35ba64df7ca70c51365c4aff65db9a9037 # v2.1.1
        with:
          cmake-version: '3.31.6'

      - name: Install Ninja
        run: |
          choco install ninja -y --version=1.12.1
          ninja --version

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configuring CMake
        run: >
          cmake -B"${{ env.builddir }}" .
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DFREECAD_USE_PCH=ON
          -DFREECAD_RELEASE_PDB=OFF
          -DFREECAD_LIBPACK_DIR="${{ env.libpackdir }}"
          -DFREECAD_COPY_DEPEND_DIRS_TO_BUILD=ON
          -DFREECAD_COPY_LIBPACK_BIN_TO_BUILD=ON
          -DFREECAD_COPY_PLUGINS_BIN_TO_BUILD=ON
          -DCMAKE_AUTOGEN_PARALLEL=4
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Check CMake configuration
        run: |
          if (-not (Test-Path "${{ env.builddir }}\build.ninja")) {
            Write-Error "CMake configuration failed - build.ninja not found"
            exit 1
          }
          if (-not (Test-Path "${{ env.builddir }}\compile_commands.json")) {
            Write-Error "CMake configuration failed - compile_commands.json not found"
            exit 1
          }
          Write-Host "CMake configuration successful"

      - name: Resolve changed files
        id: resolve
        run: |
          $changedFiles = git diff --name-only main...HEAD -- '*.cpp' '*.h' '*.hpp' '*.c' '*.cc'
          if (-not $changedFiles) {
            echo "file_count=0" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $repoRoot = (Get-Location).Path
          $compileDb = Get-Content "${{ env.builddir }}\compile_commands.json" -Raw | ConvertFrom-Json

          $compileLookup = @{}
          foreach ($entry in $compileDb) {
            $normalized = $entry.file.Replace('/', '\').ToLower()
            if (-not $compileLookup.ContainsKey($normalized)) {
              $compileLookup[$normalized] = $entry
            }
          }

          $filesToCompile = @()

          foreach ($file in $changedFiles) {
            if (-not (Test-Path $file)) {
              Write-Host "SKIP (deleted): $file"
              continue
            }

            $absolutePath = Join-Path $repoRoot $file
            $normalized = $absolutePath.Replace('/', '\').ToLower()

            if ($file -match '\.(cpp|c|cc)$') {
              if ($compileLookup.ContainsKey($normalized)) {
                $filesToCompile += $compileLookup[$normalized]
                Write-Host "COMPILE: $file"
              } else {
                Write-Host "SKIP: $file"
              }
            }
            elseif ($file -match '\.(h|hpp)$') {
              $headerName = Split-Path $file -Leaf
              Write-Host "HEADER: $file"
              $includers = git grep -l "#include.*$headerName" -- '*.cpp' '*.c' '*.cc' 2>$null
              if ($includers) {
                foreach ($inc in $includers) {
                  if (-not (Test-Path $inc)) { continue }
                  $incAbs = (Join-Path $repoRoot $inc).Replace('/', '\').ToLower()
                  if ($compileLookup.ContainsKey($incAbs)) {
                    $alreadyAdded = $filesToCompile | Where-Object { $_.file.Replace('/','\').ToLower() -eq $incAbs }
                    if (-not $alreadyAdded) {
                      $filesToCompile += $compileLookup[$incAbs]
                      Write-Host "  INCLUDER: $inc"
                    }
                  }
                }
              }
            }
          }

          $filesToCompile | ConvertTo-Json -Depth 3 | Set-Content "${{ env.builddir }}\files_to_compile.json"
          echo "file_count=$($filesToCompile.Count)" >> $env:GITHUB_OUTPUT
          Write-Host ""
          Write-Host "Files to compile: $($filesToCompile.Count)"
        shell: pwsh

      - name: Generate ui_*.h headers
        if: steps.resolve.outputs.file_count > 0
        run: |
          $commands = Get-Content "${{ env.builddir }}\files_to_compile.json" -Raw | ConvertFrom-Json

          Write-Host "Scanning files for ui_*.h includes..."
          $needed = @{}
          $fileForUi = @{}
          foreach ($c in $commands) {
            $filePath = $c.file
            if (-not (Test-Path $filePath)) { continue }
            $content = Get-Content $filePath -Raw -ErrorAction SilentlyContinue
            $uiMatches = [regex]::Matches($content, '"ui_(\w+)\.h"')
            foreach ($m in $uiMatches) {
              $name = $m.Groups[1].Value
              $needed[$name] = $true
              if (-not $fileForUi.ContainsKey($name)) {
                $fileForUi[$name] = $c
              }
            }
          }

          if ($needed.Count -eq 0) {
            Write-Host "No ui_*.h includes found - skipping"
            exit 0
          }

          Write-Host "Need: $($needed.Keys -join ', ')"

          $uic = Get-ChildItem -Path "${{ env.libpackdir }}" -Filter "uic.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uic) {
            Write-Error "uic.exe not found"
            exit 1
          }
          Write-Host "uic: $($uic.FullName)"

          $failed = 0
          foreach ($name in $needed.Keys) {
            $uiFile = Get-ChildItem -Path "src" -Filter "$name.ui" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $uiFile) {
              Write-Warning "Cannot find ${name}.ui"
              $failed++
              continue
            }

            $entry = $fileForUi[$name]
            $autogenDir = ""
            if ($entry.command -match '/I(\S+_autogen[/\\]include)') {
              $autogenDir = $Matches[1]
            }
            if (-not $autogenDir) {
              Write-Warning "No autogen dir in compile command for $name"
              $failed++
              continue
            }

            $outFile = "$autogenDir\ui_$name.h"
            Write-Host "uic: $name -> $outFile"
            & "$($uic.FullName)" "$($uiFile.FullName)" -o "$outFile"
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "uic failed for $name"
              $failed++
            }
          }

          if ($failed -gt 0) {
            Write-Error "$failed uic generations failed"
            exit 1
          }
          Write-Host "UIC complete"
        shell: pwsh

      - name: Compile changed files
        if: steps.resolve.outputs.file_count > 0
        run: |
          $commands = Get-Content "${{ env.builddir }}\files_to_compile.json" -Raw | ConvertFrom-Json
          $failed = @()

          foreach ($c in $commands) {
            $file = $c.file
            $cmd = $c.command
            $dir = $c.directory

            Write-Host ""
            Write-Host "=== $file ==="
            $result = cmd /c "cd /d `"$dir`" && $cmd 2>&1"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAILED (exit $LASTEXITCODE)"
              $result | ForEach-Object { Write-Host "  $_" }
              $failed += $file
            } else {
              Write-Host "OK"
            }
          }

          Write-Host ""
          Write-Host "Results: $($commands.Count - $failed.Count)/$($commands.Count) succeeded"

          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Host "FAILED: $_" }
            exit 1
          }
        shell: pwsh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: PR-Build-Logs
          path: |
            ${{ env.logdir }}
