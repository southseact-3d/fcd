# This workflow compiles changed files for Pull Requests.
# It runs on all PR events and serves as a pass/fail check for compilation.
# It does NOT create a Windows installer or modify the build cache.
# It restores the build cache from main branch to enable incremental builds.

name: PR Build Check

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
      - '.github/workflows/**'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  Build:
    runs-on: windows-latest
    env:
      builddir: D:/FC/build/release/
      libpackdir: D:/FC/libpack/
      logdir: C:/logs/
      config: release
      cacheKey: Windows

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Enable Win32 long paths
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
          git config --system core.longpaths true
          Write-Host "Long paths enabled"

      - name: Checking out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Fetch main branch for comparison
        run: |
          git fetch origin main:main

      - name: Make needed directories
        run: |
          New-Item -ItemType Directory -Force -Path ${{ env.libpackdir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.builddir }} | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ env.logdir }} | Out-Null

      - name: Get Libpack
        uses: ./.github/workflows/actions/windows/getLibpack
        with:
          libpackdir: ${{ env.libpackdir }}

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@3a6cbe35ba64df7ca70c51365c4aff65db9a9037 # v2.1.1
        with:
          cmake-version: '3.31.6'

      - name: Install Ninja
        run: |
          choco install ninja -y --version=1.12.1
          ninja --version

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configuring CMake
        run: >
          cmake -B"${{ env.builddir }}" .
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DFREECAD_USE_PCH=OFF
          -DFREECAD_RELEASE_PDB=OFF
          -DFREECAD_LIBPACK_DIR="${{ env.libpackdir }}"
          -DFREECAD_COPY_DEPEND_DIRS_TO_BUILD=ON
          -DFREECAD_COPY_LIBPACK_BIN_TO_BUILD=ON
          -DFREECAD_COPY_PLUGINS_BIN_TO_BUILD=ON
          -DCMAKE_AUTOGEN_PARALLEL=4

      - name: Check CMake configuration
        run: |
          if (-not (Test-Path "${{ env.builddir }}\build.ninja")) {
            Write-Error "CMake configuration failed - build.ninja not found"
            exit 1
          }
          Write-Host "CMake configuration successful"

      - name: Generate file hash for cache key
        id: file-hash
        run: |
          $cmakeHash = Get-FileHash -Path CMakeLists.txt -Algorithm SHA256 | Select-Object -ExpandProperty Hash
          $presetsHash = Get-FileHash -Path CMakePresets.json -Algorithm SHA256 | Select-Object -ExpandProperty Hash
          $combinedHash = "$cmakeHash-$presetsHash"
          echo "cmake_hash=$cmakeHash" >> $env:GITHUB_OUTPUT
          echo "combined_hash=$combinedHash" >> $env:GITHUB_OUTPUT
          Write-Host "Combined hash: $combinedHash"
        shell: pwsh

      - name: Restore Ninja build cache
        id: ninja-cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.builddir }}
          key: FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-refs/heads/main
          restore-keys: |
            FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-refs/heads/main
            FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-
            FC-NINJA-${{ env.cacheKey }}-refs/heads/main
            FC-NINJA-${{ env.cacheKey }}

      - name: Print cache status
        run: |
          $ninjaKey = "FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-refs/heads/main"
          Write-Host "Ninja cache key: $ninjaKey"
          $ninjaHit = "${{ steps.ninja-cache-restore.outputs.cache-hit }}"
          if ($ninjaHit -eq 'true') {
            Write-Host "Cache HIT - incremental build will only compile changed files"
          } else {
            Write-Host "Cache MISS - full build required"
          }

      - name: Check if source files changed
        id: check-files
        run: |
          $changedFiles = git diff --name-only main...HEAD -- '*.cpp' '*.h' '*.hpp' '*.c' '*.cc'
          if ($changedFiles) {
            Write-Host "Changed source files:"
            $changedFiles | ForEach-Object { Write-Host "  $_" }
            echo "has_changes=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No source files changed - skipping build"
            echo "has_changes=false" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Build with Ninja
        if: steps.check-files.outputs.has_changes == 'true'
        run: |
          cmake --build "${{ env.builddir }}" --config Release -j32

      - name: Save Ninja build cache
        if: steps.check-files.outputs.has_changes == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.builddir }}
          key: FC-NINJA-${{ env.cacheKey }}-${{ steps.file-hash.outputs.combined_hash }}-refs/heads/main

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: PR-Build-Logs
          path: |
            ${{ env.logdir }}
